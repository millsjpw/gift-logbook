name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server unit tests
        working-directory: ./server
        env:
          PORT: "3000"
          PLATFORM: "test"
          DB_URL: "postgres://unit-test-unused:5432/unit-test-unused"
          SESSION_DURATION: "3600"
        run: npm run test:unit -- --coverage

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint -- --max-warnings=0
